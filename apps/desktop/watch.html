    <!-- The Tauri window never asks for a favicon; this stops the browser demo logging a 404 on every load. -->

      if (!("__TAURI_INTERNALS__" in window)) document.documentElement.classList.add("no-vibrancy");
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/watch/main.tsx"></script>
