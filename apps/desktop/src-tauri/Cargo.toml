[package]
name = "talos-desktop"
version = "0.1.0"
description = "Talos Labs: plain-language security check-up for your computer"
authors = ["Talos Labs"]
edition = "2024"
# tauri dev runs a bare `cargo run`; this picks the app over the talos-collect dev binary.
default-run = "talos-desktop"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on Windows.
name = "talos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "talos-desktop"
path = "src/main.rs"

[[bin]]
name = "talos-collect"
path = "src/bin/talos-collect.rs"

[[bin]]
name = "talos-fixes"
path = "src/bin/talos-fixes.rs"

[features]
# Prints raw command output to stderr. Development only.
debug-raw = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.10"
regex = "1"
wait-timeout = "0.2"
keyring = "4"
base64 = "0.22"
dirs = "7"
libc = "0.2"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zeroize = "1"
rand = "0.9"
ureq = "3"
sha2 = "0.10"
# The watch (docs/DESIGN-WATCH.md section 8): the timer, the wake observer, the three plugins and the keyed digests.
tokio = { version = "1", features = ["time", "sync", "rt"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSApplication"] }
block2 = "0.6"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-notification = "2.7"
hmac = "0.12"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
string_slice = "deny"
# CI runs -D warnings, so a new slice or index site must be rewritten with `get` or carry an allow with a reason.
indexing_slicing = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Panics unwind so `collect::guarded` can turn a collector panic into an unavailable section.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# The crates.io tray-icon 0.25.1 puts its click target at the button's frame instead of its bounds and
# measures the icon from the status window, which is full width on macOS 26 and later. vendor/tray-icon
# is that release with those two fixes (search "Talos patch"); drop this once upstream carries them.
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
