name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The sidecar needs an Xcode with the macOS 26 SDK (FoundationModels).
    # Nothing here talks to Apple Intelligence: the runner has none, and the
    # Rust protocol tests use a fake sidecar binary.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A tagged build must not ship the all-zero licence public key placeholder.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -qE '0{64}' apps/desktop/src/license/public-key.ts; then
            echo "apps/desktop/src/license/public-key.ts still holds the placeholder public key"
            exit 1
          fi

      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r test

      # Web assets only. The Rust crate embeds frontendDist at compile time, so this runs before cargo.
      - run: pnpm --filter @talos/desktop build

      # The talos-ai helper. tauri-build looks for the externalBin files, so this runs before cargo.
      - run: xcrun swiftc --version
      - run: pnpm --filter @talos/desktop sidecar:build

      # The universal file must carry both slices; a release build picks this file.
      - run: |
          archs="$(lipo -archs apps/desktop/src-tauri/binaries/talos-ai-universal-apple-darwin)"
          echo "talos-ai-universal-apple-darwin: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "expected x86_64 and arm64, got: $archs"; exit 1 ;;
          esac

      - run: cargo test
        working-directory: apps/desktop/src-tauri

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
